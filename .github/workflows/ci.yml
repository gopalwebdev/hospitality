name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A branch that is pushed again makes the run already in flight redundant, so
# only the newest commit on a ref is ever being checked. main included: a
# superseded commit there is recorded as cancelled rather than keeping its own
# result, and only the newest commit reaches staging. That is the point — the
# deployed commit is the one at the tip, not whichever run happened to finish
# last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The runner image is pinned rather than left on `ubuntu-latest`, which is
# migrating to Ubuntu 26 between 19 October and 19 November 2026 and so hands
# out either image while that runs. Two reasons to stay on 24.04 for now: a
# green run should mean the same thing every time, and the pinned
# shivammathur/setup-php is 2.37.2, which predates the Ubuntu 26.04 support
# added in 2.40.0. Moving to `ubuntu-26.04` means bumping that action first.
jobs:
  code-style:
    name: Code style
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check formatting
        run: composer lint:check

      - name: Check refactorings
        run: composer refactor:check

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Analyse types
        run: composer types:check

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Read by the `report` job to put the counts in the one shared summary.
    outputs:
      totals: ${{ steps.totals.outputs.totals }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: 'true'
          wayfinder: 'true'

      - name: Check formatting and lints
        run: npm run check

      - name: Check types
        run: npm run types:check

      # Vitest starts Vite in dev-server mode, which laravel-vite-plugin refuses
      # to do whenever CI is set. This is the escape hatch the plugin documents.
      # `pipefail` keeps the job red when the suite fails despite the tee.
      - name: Run frontend tests
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: |
          set -o pipefail
          npm run test 2>&1 | tee "$RUNNER_TEMP/frontend.log"

      # `always()`, so a failing suite still reports its counts rather than
      # leaving a blank cell in the summary.
      - name: Collect the frontend totals
        id: totals
        if: always()
        run: |
          log="$RUNNER_TEMP/frontend.log"
          [ -f "$log" ] || exit 0

          # vite-plus paints its output, and the escapes would land in the
          # markdown table verbatim.
          plain=$(sed -E $'s/\033\[[0-9;]*[A-Za-z]//g' "$log")

          files=$(printf '%s\n' "$plain" | grep -oE 'Test Files[[:space:]]+.*' | tail -1 | sed -E 's/Test Files[[:space:]]+//')
          tests=$(printf '%s\n' "$plain" | grep -oE '(^|[[:space:]])Tests[[:space:]]+[0-9].*' | tail -1 | sed -E 's/^[[:space:]]*Tests[[:space:]]+//')

          summary=""
          [ -n "$files" ] && summary="Files ${files}"
          [ -n "$tests" ] && summary="${summary:+$summary · }Tests ${tests}"

          echo "totals=${summary}" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Read by the `report` job to put the counts in the one shared summary.
    outputs:
      totals: ${{ steps.totals.outputs.totals }}

    # The suite is the slowest job and the only one that needs a database, so
    # it waits for the three cheap checks. A branch that fails formatting or a
    # type check never spins up Postgres or builds the bundle.
    needs:
      - code-style
      - static-analysis
      - frontend

    # The application runs on Postgres and nothing else, so the suite does too:
    # jsonb, CHECK constraints and expression indexes are part of what it tests.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hospitality_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Real environment variables win over both .env and phpunit.xml, so the
    # migrate step and the suite reach this service rather than a local server.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hospitality_testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: 'true'

      - name: Migrate the database
        run: php artisan migrate --force

      - name: Publish Filament assets
        run: php artisan filament:assets

      # The Inertia views resolve assets through the Vite manifest, so the
      # bundle has to exist before the feature tests render any page.
      - name: Build assets
        run: npm run build

      - name: Run tests
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee "$RUNNER_TEMP/tests.log"

      # `always()`, so a failing suite still reports its counts rather than
      # leaving a blank cell in the summary.
      - name: Collect the suite totals
        id: totals
        if: always()
        run: |
          log="$RUNNER_TEMP/tests.log"
          [ -f "$log" ] || exit 0

          plain=$(sed -E $'s/\033\[[0-9;]*[A-Za-z]//g' "$log")

          tests=$(printf '%s\n' "$plain" | grep -oE '^[[:space:]]*Tests:[[:space:]]+.*' | tail -1 | sed -E 's/^[[:space:]]*Tests:[[:space:]]+//')
          duration=$(printf '%s\n' "$plain" | grep -oE '^[[:space:]]*Duration:[[:space:]]+.*' | tail -1 | sed -E 's/^[[:space:]]*Duration:[[:space:]]+//')

          summary="$tests"
          [ -n "$duration" ] && summary="${summary:+$summary, }${duration}"

          echo "totals=${summary}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    # The last link in lint/check/format -> tests -> deploy. `needs` defaults
    # to running only when what it waits on succeeded, and `tests` already
    # waits on the other three, so naming it here gates the deploy on all
    # four. Anything red anywhere up the chain means no deploy.
    needs: tests

    # Pushes to main only. `on.push.branches` already narrows pushes to main,
    # and this keeps a pull request — which has no deploy of its own — out.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # The hook URL is an environment secret on the `staging` environment, so
    # the job has to name it to be handed the secret at all.
    environment: staging

    # Cancelling a superseded run is not instant, so a deploy that has already
    # started keeps going for a moment while the next run catches up. This
    # serialises that window: the two hooks fire one after another rather than
    # together, and the newer commit lands last.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      # No checkout: the hook needs nothing from the tree, only the SHA, and
      # the URL stays in the environment rather than on the command line.
      - name: Trigger the Laravel Cloud deployment
        env:
          DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::LARAVEL_CLOUD_STAGING_DEPLOY_HOOK is not set on the staging environment." >&2
            exit 1
          fi

          # `commit_hash` pins the deployment to the commit CI just proved
          # green, rather than whatever the branch tip happens to be by the
          # time Laravel Cloud pulls. No --location: the URL is a secret and
          # must not be re-sent to a redirect target.
          curl \
            --request POST \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            "${DEPLOY_HOOK}?commit_hash=${GITHUB_SHA}"

  report:
    name: CI report
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    # Every job, and `always()`, because the point of this one is to describe
    # a red run as well as a green one. It gates nothing and is deliberately
    # left out of the deploy chain — it runs after the deploy has been decided.
    needs:
      - code-style
      - static-analysis
      - frontend
      - tests
      - deploy-staging
    if: always()

    steps:
      - name: Write the run summary
        env:
          CODE_STYLE: ${{ needs.code-style.result }}
          STATIC_ANALYSIS: ${{ needs.static-analysis.result }}
          FRONTEND: ${{ needs.frontend.result }}
          TESTS: ${{ needs.tests.result }}
          DEPLOY: ${{ needs.deploy-staging.result }}
          FRONTEND_TOTALS: ${{ needs.frontend.outputs.totals }}
          TESTS_TOTALS: ${{ needs.tests.outputs.totals }}
        run: |
          mark() {
            case "$1" in
              success)   echo "✅ passed" ;;
              failure)   echo "❌ failed" ;;
              cancelled) echo "⛔ cancelled" ;;
              skipped)   echo "⏭️ skipped" ;;
              *)         echo "❔ $1" ;;
            esac
          }

          # A dash renders better than an empty cell when a job never got far
          # enough to report its counts.
          detail() {
            if [ -n "$1" ]; then echo "$1"; else echo "—"; fi
          }

          if [ "$CODE_STYLE" = success ] && [ "$STATIC_ANALYSIS" = success ] \
            && [ "$FRONTEND" = success ] && [ "$TESTS" = success ]; then
            headline="✅ **All checks passed.**"
          else
            headline="❌ **CI failed.** See the table below for which stage."
          fi

          case "$DEPLOY" in
            success) deployed="🚀 Staging deployed from \`${GITHUB_SHA:0:7}\`." ;;
            failure) deployed="❌ Staging deploy failed — CI was green but the hook did not fire." ;;
            skipped) deployed="⏭️ No staging deploy (not a push to \`main\`, or CI was not green)." ;;
            *)       deployed="❔ Staging deploy: $DEPLOY." ;;
          esac

          {
            echo "## CI summary"
            echo
            echo "$headline"
            echo
            echo "| Stage | Job | Result | Detail |"
            echo "| --- | --- | --- | --- |"
            echo "| Checks | Code style | $(mark "$CODE_STYLE") | \`pint\` + \`rector\` |"
            echo "| Checks | Static analysis | $(mark "$STATIC_ANALYSIS") | \`phpstan\` |"
            echo "| Checks | Frontend | $(mark "$FRONTEND") | $(detail "$FRONTEND_TOTALS") |"
            echo "| Suite | Tests | $(mark "$TESTS") | $(detail "$TESTS_TOTALS") |"
            echo "| Deploy | Staging | $(mark "$DEPLOY") | Laravel Cloud |"
            echo
            echo "$deployed"
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`, pushed by \`${GITHUB_ACTOR}\`."
          } >> "$GITHUB_STEP_SUMMARY"
